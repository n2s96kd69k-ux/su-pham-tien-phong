name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        # Reads pnpm 10.32.1 from package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      - run: pnpm run build:web --base=/su-pham-tien-phong/
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check the built site at its Pages path
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          ln -s "$PWD/dist/web" "$RUNNER_TEMP/pages/su-pham-tien-phong"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages" &
          trap 'kill $!' EXIT
          curl --retry 10 --retry-connrefused --fail --silent --output /dev/null http://127.0.0.1:4173/su-pham-tien-phong/
          node scripts/check-pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
