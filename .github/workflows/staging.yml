name: Publish staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate configuration and build
        run: |
          node scripts/staging-config.mjs
          pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Migrate staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config .local/staging.json
      - name: Check published catalog
        run: node scripts/check-catalog.mjs "$VITE_API_BASE"
